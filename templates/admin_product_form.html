<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product %}Redigera{% else %}Ny{% endif %} Produkt — EcoByLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="admin-body dashboard">
    <aside class="admin-sidebar">
        <span class="logo">EcoByLife</span>
        <nav class="admin-nav">
            <a href="{{ url_for('admin_dashboard') }}">📊 Dashboard</a>
            <a href="{{ url_for('admin_new_product') }}" class="active">➕ Ny produkt</a>
            <a href="{{ url_for('index') }}" target="_blank">🌿 Se sida</a>
            <a href="{{ url_for('admin_logout') }}" class="logout">Logga ut</a>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="product-form-wrap">
            <h2>{% if product %}Redigera produkt{% else %}Lägg till ny produkt{% endif %}</h2>

            <form method="POST" enctype="multipart/form-data" class="product-form">
                <div class="form-group">
                    <label>Produktnamn *</label>
                    <input type="text" name="name" class="form-input" required
                           value="{{ product['name'] if product else '' }}" placeholder="T.ex. Rosehip Face Serum">
                </div>

                <div class="form-group">
                    <label>Beskrivning</label>
                    <textarea name="description" class="form-input" rows="4"
                              placeholder="Beskriv produkten...">{{ product['description'] if product else '' }}</textarea>
                </div>

                <div class="form-group">
                    <label>Kategori *</label>
                    <select name="category" class="form-input" required>
                        {% for cat in ['Skincare', 'Makeup', 'Haircare', 'Fragrance'] %}
                        <option value="{{ cat }}" {% if product and product['category'] == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Produktbild</label>
                    {% if product and product['image'] %}
                    <div class="current-img">
                        <img src="{{ url_for('static', filename='images/products/' + product['image']) }}" alt="Nuvarande bild">
                        <p>Ladda upp ny bild för att ersätta</p>
                    </div>
                    {% endif %}
                    <div class="file-upload-area" id="uploadArea">
                        <input type="file" name="image" id="imageInput" accept="image/*" onchange="previewImage(this)">
                        <div class="upload-prompt" id="uploadPrompt">
                            <span>📷</span>
                            <p>Klicka eller dra en bild hit</p>
                            <small>PNG, JPG, WEBP · Max 5MB</small>
                        </div>
                        <img id="imagePreview" style="display:none" alt="Förhandsvisning">
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="featured"
                               {% if product and product['featured'] %}checked{% endif %}>
                        <span>Visa som featured produkt på startsidan</span>
                    </label>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn-outline">Avbryt</a>
                    <button type="submit" class="btn-primary">
                        {% if product %}Spara ändringar{% else %}Lägg till produkt{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
    function previewImage(input) {
        const preview = document.getElementById('imagePreview');
        const prompt = document.getElementById('uploadPrompt');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                prompt.style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
    document.getElementById('uploadArea').addEventListener('click', () => {
        document.getElementById('imageInput').click();
    });
    </script>
</body>
</html>
